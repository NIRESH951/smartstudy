# =====================================================================
# SmartStudy backend configuration
#
# Every secret / environment-specific value comes from an environment
# variable. The defaults below are for LOCAL DEVELOPMENT ONLY.
#   DB_URL, DB_USERNAME, DB_PASSWORD   MySQL connection
#   SERVER_PORT                        HTTP port (default 8080)
#   APP_CORS_ALLOWED_ORIGINS           comma-separated browser origins
#   COOKIE_SECURE                      true when served over HTTPS
#   SPRING_PROFILES_ACTIVE             dev (default) or prod
# =====================================================================
spring:
  application:
    name: smartstudy
  profiles:
    default: dev

  datasource:
    # connectionTimeZone=UTC + forceConnectionTimeZoneToSession=true make MySQL store and return
    # every DATETIME as UTC, independent of the server's or the laptop's time zone.
    url: ${DB_URL:jdbc:mysql://localhost:3306/smartstudy?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&sslMode=PREFERRED}
    username: ${DB_USERNAME:smartstudy}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000

  jpa:
    # Flyway owns the schema. Hibernate must never create or alter tables.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:12h}
      cookie:
        name: SMARTSTUDY_SESSION
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

smartstudy:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
    interval-ms: 900000
    initial-delay-ms: 60000
  planner:
    # Priority = 0.30 W + 0.25 U + 0.20 D + 0.15 R + 0.10 I  (see PriorityCalculator)
    weights:
      weakness: 0.30
      exam-urgency: 0.25
      difficulty: 0.20
      revision-overdue: 0.15
      subject-importance: 0.10
    unassessed-weakness: 50
    urgency-horizon-days: 30
    revision-overdue-cap-days: 14
    default-horizon-days: 7
    max-horizon-days: 28
    min-slot-minutes: 25
    repeat-decay-factor: 0.80
    max-sessions-per-topic-per-day: 2
    revision-session-minutes: 30
    missed-grace-minutes: 30
  focus:
    auto-complete-grace-seconds: 600
    max-planned-minutes: 120
